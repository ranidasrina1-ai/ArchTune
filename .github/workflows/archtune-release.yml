name: Build ArchTune APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: archtune-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '27'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate signing keystore
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          keytool -genkeypair -v \
            -keystore app/keystore/release.keystore \
            -alias archtune \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass archtune \
            -keypass archtune \
            -dname "CN=ArchTune,O=ArchTune,C=US"

      - name: Build release APK
        env:
          STORE_PASSWORD: archtune
          KEY_ALIAS: archtune
          KEY_PASSWORD: archtune
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain assembleGmsMobileUniversalRelease

      - name: Collect APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -path '*release*' | head -n 1)"
          test -n "$APK"
          cp "$APK" ArchTune.apk
          ls -lh ArchTune.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: archtune-${{ github.run_number }}
          name: ArchTune build ${{ github.run_number }}
          body: |
            ArchTune personal build.

            - LAN Music Together fixes
            - Readable join link + QR code
            - ArchTune branding
          files: ArchTune.apk
          generate_release_notes: false
